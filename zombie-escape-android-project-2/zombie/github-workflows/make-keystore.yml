name: Make upload keystore
on:
  workflow_dispatch:
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Snow Zombie, O=Game, C=US"
          {
            echo "KEYSTORE_BASE64=$(base64 -w0 upload.jks)"
            echo "KEY_ALIAS=upload"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
          } > secrets.txt
      - name: Upload (private - keep safe)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-KEEP-PRIVATE
          path: |
            secrets.txt
            upload.jks
